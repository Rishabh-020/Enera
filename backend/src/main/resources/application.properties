spring.config.import=optional:file:.env.properties

spring.application.name=backend
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
app.cors.frontend-url=${FRONTEND_URL:https://enera-steel.vercel.app}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.error.include-stacktrace=never
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

jwt.secret=${JWT_SECRET}
enera.iot.api-key=${IOT_API_KEY:enera-iot-secure-key-2026}